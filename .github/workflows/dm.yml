name: Пошук в особистих повідомленнях

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub запускає приблизно раз на 5–15 хвилин
  workflow_dispatch:

permissions:
  contents: write            # щоб зберегти data/dm_state.json

concurrency:
  group: dm
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Відповісти на повідомлення
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m bot.dm
      - name: Зберегти стан
        run: |
          git config user.name "parfumsbot"
          git config user.email "parfumsbot@users.noreply.github.com"
          git add data/dm_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Пошук: оновлено позицію"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
