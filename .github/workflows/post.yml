name: Публікація новинок

on:
  schedule:
    - cron: "0 */3 * * *"   # кожні 3 години (UTC)
  workflow_dispatch:         # ручний запуск з вкладки Actions

permissions:
  contents: write            # щоб зберегти data/posted.json

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Знайти та опублікувати новинки
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_POSTS: "3"
        run: python -m bot.main
      - name: Зберегти стан
        run: |
          git config user.name "parfumsbot"
          git config user.email "parfumsbot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Оновлено список опублікованих"
          git push
