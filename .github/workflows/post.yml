name: Публікація новинок

on:
  schedule:
    # 11:00 за Києвом. GitHub знає лише UTC, тому два запуски (08:00 і 09:00 UTC),
    # а крок нижче пропускає той, що не припадає на 11-ту годину (літній/зимовий час).
    - cron: "0 8,9 * * *"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Опублікувати все за останні N днів (порожньо: усе нове з минулого запуску)"
        default: ""
      weekly:
        description: "Недільні зведення (auto = лише в неділю, yes = зараз)"
        default: "auto"
      max_posts:
        description: "Запобіжник: не більше стількох постів"
        default: "200"

permissions:
  contents: write            # щоб зберегти data/posted.json

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Перевірити, що зараз 11-та за Києвом
        id: time
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Kyiv date +%H)" != "11" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.time.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.time.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.time.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Знайти та опублікувати новинки
        if: steps.time.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SINCE_DAYS: ${{ inputs.since_days }}
          WEEKLY: ${{ inputs.weekly || 'auto' }}
          MAX_POSTS: ${{ inputs.max_posts || '200' }}
        run: python -m bot.main
      - name: Зберегти стан
        if: steps.time.outputs.skip != 'true'
        run: |
          git config user.name "parfumsbot"
          git config user.email "parfumsbot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Оновлено список опублікованих"
          git pull --rebase origin main
          git push
